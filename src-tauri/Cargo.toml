[package]
name = "margin"
version = "0.1.0"
edition = "2021"
description = "Margin notes for Windows"

[lib]
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "../crates/notes-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
